name: weDO fixed-image publication
on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/staging-publication.yml'
      - '.github/scripts/ghcr_publication.py'
      - '.github/tests/test_ghcr_publication.py'
      - 'docs/STAGING_GHCR_PUBLICATION.md'
  push:
    branches: [dev]
    paths:
      - '.github/workflows/staging-publication.yml'
# No dispatch/default-branch change; PRs can execute only read-only validation.
permissions:
  contents: read
jobs:
  safe-checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Offline provenance, checksum, gate, collision and redaction regressions
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s .github/tests -p test_ghcr_publication.py -v
      - name: Read-only audit of the fixed validated artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/ghcr_publication.py audit
  preflight:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && github.repository == 'HuyGiang1/weDO-app' }}
    needs: safe-checks
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Fail closed before scheduling a write-capable environment job
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/ghcr_publication.py gate
  publish:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && github.repository == 'HuyGiang1/weDO-app' }}
    needs: preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    environment: staging-image-publication
    concurrency:
      group: ghcr-wedo-backend-afac8aae74ae12539e94542a3beed21cda562f3a
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify configured gate and explicit review for this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/ghcr_publication.py approved
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          repository: HuyGiang1/weDO-app
          run-id: '41291866605'
          artifact-ids: '13076784704'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/wedo-validated-image
          merge-multiple: true
      - name: Verify checksum before load, then exact image identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/ghcr_publication.py image
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Collision-safe publication and remote digest/identity verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/ghcr_publication.py publish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: publication-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wedo-publication-evidence/*.json
          retention-days: 30
          if-no-files-found: warn
