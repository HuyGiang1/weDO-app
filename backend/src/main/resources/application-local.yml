spring:
  datasource:
    url: ${WEDO_DB_URL:jdbc:postgresql://localhost:5432/wedo}
    username: ${WEDO_DB_USERNAME:wedo}
    password: ${WEDO_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  data:
    redis:
      host: ${WEDO_REDIS_HOST:localhost}
      port: ${WEDO_REDIS_PORT:6379}

media:
  s3:
    bootstrap-bucket: ${WEDO_MEDIA_BOOTSTRAP_BUCKET:true}
    endpoint: ${WEDO_MEDIA_S3_ENDPOINT:http://localhost:9000}
    public-endpoint: ${WEDO_MEDIA_PUBLIC_ENDPOINT:http://127.0.0.1:9000}
    bucket: ${WEDO_MEDIA_BUCKET:wedo-media}
    region: ${WEDO_MEDIA_REGION:us-east-1}
    access-key: ${WEDO_MEDIA_ACCESS_KEY}
    secret-key: ${WEDO_MEDIA_SECRET_KEY}
    path-style: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

security:
  jwt:
    secret-base64: ${WEDO_JWT_SECRET_BASE64}
    access-token-ttl: 15m
  auth-token:
    pepper-base64: ${WEDO_AUTH_TOKEN_PEPPER_BASE64}
  profile-completion-token:
    secret-base64: ${WEDO_PROFILE_COMPLETION_TOKEN_SECRET_BASE64}
    ttl: 15m
  refresh-token:
    ttl: 14d
  login:
    max-failed-attempts: 5
    lock-duration: 15m

# Only used when explicitly enabling synthetic local accounts.
wedo:
  local-test-data:
    password: ${WEDO_LOCAL_TEST_PASSWORD:}
