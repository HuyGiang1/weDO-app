spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/wedo
    username: wedo
    password: wedo_local

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always
