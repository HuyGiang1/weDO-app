spring:
  datasource:
    url: ${WEDO_DB_URL:jdbc:postgresql://localhost:5432/wedo}
    username: ${WEDO_DB_USERNAME:wedo}
    password: ${WEDO_DB_PASSWORD:wedo_local}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  data:
    redis:
      host: ${WEDO_REDIS_HOST:localhost}
      port: ${WEDO_REDIS_PORT:6379}

media:
  s3:
    bootstrap-bucket: ${WEDO_MEDIA_BOOTSTRAP_BUCKET:true}
    endpoint: ${WEDO_MEDIA_S3_ENDPOINT:http://localhost:9000}
    public-endpoint: ${WEDO_MEDIA_PUBLIC_ENDPOINT:http://127.0.0.1:9000}
    bucket: ${WEDO_MEDIA_BUCKET:wedo-media}
    region: ${WEDO_MEDIA_REGION:us-east-1}
    access-key: ${WEDO_MEDIA_ACCESS_KEY:wedo_local_access}
    secret-key: ${WEDO_MEDIA_SECRET_KEY:wedo_local_secret_change_me}
    path-style: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

security:
  jwt:
    secret-base64: ${WEDO_JWT_SECRET_BASE64:1WZTYD0Q6/LbmgH08YrpYg+Xwsn19ZXp2M3WObbPl/4=}
    access-token-ttl: 15m
  auth-token:
    pepper-base64: ${WEDO_AUTH_TOKEN_PEPPER_BASE64:k7e8pP5Fj9sW2mN1bV4cZ0xL8qJ3hT6rY9uI2oP5aD8=}
  profile-completion-token:
    secret-base64: ${WEDO_PROFILE_COMPLETION_TOKEN_SECRET_BASE64:s4A8wY0D2eE6vK1L5oP9tQ3rF7mN8xZ2cT4vB6nI8uM=}
    ttl: 15m
  refresh-token:
    ttl: 14d
  login:
    max-failed-attempts: 5
    lock-duration: 15m
