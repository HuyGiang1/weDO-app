spring:
  datasource:
    url: ${WEDO_DB_URL:jdbc:postgresql://localhost:5432/wedo}
    username: ${WEDO_DB_USERNAME:wedo}
    password: ${WEDO_DB_PASSWORD:wedo_local}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  data:
    redis:
      host: ${WEDO_REDIS_HOST:localhost}
      port: ${WEDO_REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always