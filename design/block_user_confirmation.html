<body
    class="bg-background text-on-background antialiased min-h-screen relative flex items-center justify-center font-body-md overflow-hidden">
    <!-- Mock Background Content to give context -->
    <div class="absolute inset-0 z-0 opacity-40 select-none pointer-events-none p-margin-mobile flex flex-col gap-sm">
        <header
            class="flex items-center justify-between w-full max-w-7xl mx-auto top-0 sticky bg-surface px-margin-mobile py-xs z-10 flat no shadows">
            <div class="flex items-center gap-sm">
                <img class="w-10 h-10 rounded-full object-cover"
                    data-alt="A small circular profile picture of a young professional wearing casual tech attire against a light gray background, bright and optimistic mood. High quality lifestyle photography."
                    src="https://lh3.googleusercontent.com/aida-public/AB6AXuCciQ0BcgsufqVpeICD_w_xM3-u2Tezz6bD3kKZWy0JDs7BeQ52sBG4ctffI9t5JZtjATjMPsXV2rE3gYEqybZPf1-y6rtfjUGxZAsJbt9lRh9qKUFGySB1fbvV3UoZ85xiRCKa7e5p6n8DzT6N3TGfSTNEFYpb4xPdf8Bwa1wRgn6u8ntXZq4y3GDbTGPwAWTtsd3-wrFQGtvP3CKyc1Ri6CkgMdLrR9MmpjpuZYygKXjoxfyArv00aw">
            </div>
            <span class="font-headline-md text-headline-md-mobile text-primary font-bold">WeDo</span>
            <button
                class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center text-on-surface-variant hover:bg-surface-container-high transition-colors">
                <span class="material-symbols-outlined" data-icon="notifications">notifications</span>
            </button>
        </header>
        <div class="flex flex-col gap-sm mt-md w-full max-w-md mx-auto">
            <div class="h-48 w-full bg-surface-container rounded-[24px]"></div>
            <div class="h-32 w-full bg-surface-container rounded-[24px]"></div>
            <div class="h-64 w-full bg-surface-container rounded-[24px]"></div>
        </div>
    </div>
    <!-- Overlay Layer: Bottom Sheet / Modal for Blocking User -->
    <div
        class="fixed inset-0 z-50 flex flex-col justify-end md:justify-center items-center backdrop-blur-layer bg-on-background/20 transition-opacity duration-300">
        <!-- Bottom Sheet (Mobile) / Modal (Desktop) Container -->
        <div
            class="w-full max-w-md bg-surface rounded-t-[24px] md:rounded-[24px] shadow-[0_-4px_20px_0_rgba(99,14,212,0.04)] md:shadow-[0_8px_30px_0_rgba(99,14,212,0.08)] flex flex-col transform transition-transform duration-300 translate-y-0">
            <!-- Handle for mobile visual cue -->
            <div class="w-full flex justify-center pt-xs pb-sm md:hidden">
                <div class="w-12 h-1.5 bg-surface-variant rounded-full"></div>
            </div>
            <!-- Content Area -->
            <div class="px-margin-mobile pt-sm md:pt-md pb-md flex flex-col gap-lg">
                <!-- Header & Icon -->
                <div class="flex flex-col items-center text-center gap-xs">
                    <div
                        class="w-16 h-16 rounded-full bg-error-container flex items-center justify-center mb-xs text-error">
                        <span class="material-symbols-outlined" data-icon="block" style="font-size: 32px;">block</span>
                    </div>
                    <h2 class="font-headline-md text-headline-md-mobile md:text-headline-md text-on-surface">Block User
                    </h2>
                    <p class="font-body-md text-body-md text-on-surface-variant max-w-[280px]">
                        Are you sure you want to block <span class="font-bold text-on-surface">Alex Mercer</span>?
                    </p>
                </div>
                <!-- Informational List -->
                <div class="bg-surface-container-low rounded-xl p-sm flex flex-col gap-sm">
                    <div class="flex items-start gap-xs">
                        <span class="material-symbols-outlined text-on-surface-variant" data-icon="person_remove"
                            style="font-size: 20px;">person_remove</span>
                        <div class="flex flex-col">
                            <span class="font-label-md text-label-md text-on-surface">Removes Friendship</span>
                            <span class="font-label-sm text-label-sm text-outline">You will no longer be friends.</span>
                        </div>
                    </div>
                    <div class="h-px w-full bg-surface-variant"></div>
                    <div class="flex items-start gap-xs">
                        <span class="material-symbols-outlined text-on-surface-variant" data-icon="speaker_notes_off"
                            style="font-size: 20px;">speaker_notes_off</span>
                        <div class="flex flex-col">
                            <span class="font-label-md text-label-md text-on-surface">Blocks Direct Messages</span>
                            <span class="font-label-sm text-label-sm text-outline">They cannot message you
                                directly.</span>
                        </div>
                    </div>
                    <div class="h-px w-full bg-surface-variant"></div>
                    <div class="flex items-start gap-xs">
                        <span class="material-symbols-outlined text-on-surface-variant" data-icon="info"
                            style="font-size: 20px;">info</span>
                        <div class="flex flex-col">
                            <span class="font-label-md text-label-md text-on-surface">Group Context</span>
                            <span class="font-label-sm text-label-sm text-outline">Shared group content might still be
                                visible.</span>
                        </div>
                    </div>
                </div>
                <!-- Actions -->
                <div class="flex flex-col gap-xs w-full mt-xs">
                    <button
                        class="w-full bg-error text-on-error font-label-md text-label-md py-sm rounded-full flex items-center justify-center gap-xs active:scale-95 transition-transform duration-200 hover:opacity-90">
                        <span class="material-symbols-outlined" data-icon="block" data-weight="fill"
                            style="font-variation-settings: 'FILL' 1; font-size: 18px;">block</span>
                        Block User
                    </button>
                    <button
                        class="w-full bg-surface text-on-surface font-label-md text-label-md py-sm rounded-full active:scale-95 transition-transform duration-200 hover:bg-surface-container-low border border-outline-variant">
                        Cancel
                    </button>
                </div>
            </div>
        </div>
    </div>
    <!-- Navigation Suppressed intentionally per rules for transactional/task-focused modal views -->
