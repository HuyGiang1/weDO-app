<script>
        // Simple Tab Switching Logic
        document.addEventListener('DOMContentLoaded', () => {
            const tabReceived = document.getElementById('tab-received');
            const tabSent = document.getElementById('tab-sent');
            const listReceived = document.getElementById('list-received');
            const listSent = document.getElementById('list-sent');

            function switchTab(activeTab, inactiveTab, activeList, inactiveList) {
                activeTab.classList.add('tab-active');
                activeTab.classList.remove('tab-inactive', 'hover:text-primary', 'hover:bg-surface-container-low');
                
                inactiveTab.classList.remove('tab-active');
                inactiveTab.classList.add('tab-inactive', 'hover:text-primary', 'hover:bg-surface-container-low');

                activeList.classList.remove('hidden');
                activeList.classList.add('flex');
                
                inactiveList.classList.add('hidden');
                inactiveList.classList.remove('flex');
            }

            tabReceived.addEventListener('click', () => {
                switchTab(tabReceived, tabSent, listReceived, listSent);
            });

            tabSent.addEventListener('click', () => {
                switchTab(tabSent, tabReceived, listSent, listReceived);
            });
        });
    </script>
