services:
  postgres:
    image: postgres:17
    container_name: wedo-postgres
    environment:
      POSTGRES_DB: wedo
      POSTGRES_USER: wedo
      POSTGRES_PASSWORD: wedo_local
    ports:
      - "5432:5432"
    volumes:
      - wedo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wedo -d wedo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: wedo-redis
    ports:
      - "6379:6379"
    volumes:
      - wedo_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  wedo_postgres_data:
  wedo_redis_data:
