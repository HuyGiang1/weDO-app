services:
  postgres:
    image: postgres:17
    container_name: wedo-postgres
    environment:
      POSTGRES_DB: ${WEDO_DB_NAME:-wedo}
      POSTGRES_USER: ${WEDO_DB_USERNAME:-wedo}
      POSTGRES_PASSWORD: ${WEDO_DB_PASSWORD:?Set a private generated WEDO_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - wedo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wedo -d wedo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: wedo-redis
    ports:
      - "6379:6379"
    volumes:
      - wedo_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/aistor/minio:RELEASE.2026-09-19T17-05-25Z
    container_name: wedo-minio
    command: server /data --console-address ":9001" --license /minio.license
    environment:
      MINIO_ROOT_USER: ${WEDO_MEDIA_ACCESS_KEY:?Set private MinIO access key}
      MINIO_ROOT_PASSWORD: ${WEDO_MEDIA_SECRET_KEY:?Set private MinIO secret key}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - wedo_minio_data:/data
      - type: bind
        source: ${WEDO_AISTOR_LICENSE_PATH:?Set WEDO_AISTOR_LICENSE_PATH to the external AIStor license file}
        target: /minio.license
        read_only: true

volumes:
  wedo_postgres_data:
  wedo_redis_data:
  wedo_minio_data:
